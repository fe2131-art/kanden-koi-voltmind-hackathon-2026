name: Temporary Kaggle public recovery

on:
  pull_request:
    branches: [main]

jobs:
  single-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download manifest only
        run: |
          set -euxo pipefail
          mkdir -p out
          BASE='https://www.kaggle.com/api/v1/datasets/download/kaggle/kaggriculture-episodes-2026-08-10'
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "$BASE/manifest.csv?datasetVersionNumber=1" -o out/manifest.csv
          wc -c out/manifest.csv
          head -5 out/manifest.csv
      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-daily-manifest
          path: out/
          if-no-files-found: warn
